name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 生成更新说明需要历史记录和上一个 tag
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 版本号取自 tag（v1.0.0 → 1.0.0）
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+') {
            throw "Tag '$tag' 不是 v<major>.<minor>.<patch> 格式"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: dotnet publish OML.Desktop/OML.Desktop.csproj -c Release -o publish

      - name: Install vpk
        shell: pwsh
        run: |
          dotnet tool install -g vpk
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Pack
        shell: pwsh
        run: |
          vpk pack `
            -u OML `
            -v ${{ steps.version.outputs.version }} `
            -p publish `
            -e OML.Desktop.exe `
            --packTitle "OML" `
            --packAuthors "LSwzx" `
            --channel win `
            --msi

      - name: Upload to GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          vpk upload github `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --token "$env:GITHUB_TOKEN" `
            --publish `
            --releaseName "OML ${{ github.ref_name }}" `
            --tag "${{ github.ref_name }}"

      # 一键安装器没有目录选择页，附带一个图形化选择目录的脚本。
      - name: Upload installer helper scripts
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" `
            "scripts/install-oml.ps1" `
            "scripts/安装到指定目录.cmd" `
            --clobber

      # Velopack 的 Setup/MSI 都没有目录页，这里用 NSIS 包一层真正的安装向导：
      # 目录页选好后静默调用 Setup --installto，更新链路仍由 Velopack 负责。
      - name: Build path-selecting installer (NSIS)
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          New-Item -ItemType Directory -Force -Path installer\payload | Out-Null
          Copy-Item "Releases\OML-win-Setup.exe" "installer\payload\" -Force
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /V2 installer\oml.nsi
          Get-ChildItem installer\OML-win-Installer.exe | Select-Object Name, Length

      # vpk upload 不保证带上 MSI，且 release 说明默认是英文的自动 changelog。
      - name: Attach MSI and write Chinese release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"

          if (Test-Path "Releases\OML-win.msi") {
            gh release upload $tag "Releases\OML-win.msi" --clobber
          } else {
            Write-Warning "没有找到 Releases\OML-win.msi，跳过上传"
          }

          if (Test-Path "installer\OML-win-Installer.exe") {
            gh release upload $tag "installer\OML-win-Installer.exe" --clobber
          }

          $previous = git describe --tags --abbrev=0 "$tag^" 2>$null
          if ($previous) {
            $range = "$previous..$tag"
            $lines = (git log $range --pretty=format:"- %s") -join "`n"
          } else {
            $range = $tag
            $lines = (git log $tag --pretty=format:"- %s" -n 30) -join "`n"
          }

          $notes = @"
          ## 本次更新

          $lines

          ## 安装说明

          - **OML-win.msi**：安装向导可选目录，装到 Program Files 等受保护目录时走 UAC
          - **OML-win-Setup.exe**：一键安装（按用户，装到 %LocalAppData%\OML）
          - **OML-win-Portable.zip**：免安装，解压即用

          完整对比：https://github.com/${{ github.repository }}/compare/$($range.Replace('..', '...'))
          "@

          [System.IO.File]::WriteAllText("$PWD\release-notes.md", $notes, [System.Text.UTF8Encoding]::new($false))
          gh release edit $tag --notes-file "release-notes.md"

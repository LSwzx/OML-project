name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+') {
            throw "Tag '${{ github.ref_name }}' 不是 v<major>.<minor>.<patch> 格式"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: dotnet publish OML.Desktop/OML.Desktop.csproj -c Release -o publish

      # Velopack 只用来生成 Setup 载荷，最终不再上传它的资产；
      # 对外只发 Installer.exe 与 Portable.zip 两个文件。
      - name: Build Velopack setup payload
        shell: pwsh
        run: |
          dotnet tool install -g vpk
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          vpk pack -u OML -v ${{ steps.version.outputs.version }} -p publish -e OML.Desktop.exe -o Releases --icon OML.Desktop/Assets/oml.ico

      - name: Build installer with directory page
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          New-Item -ItemType Directory -Force -Path installer\payload | Out-Null
          Copy-Item "Releases\OML-win-Setup.exe" "installer\payload\" -Force
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /V2 installer\oml.nsi
          Move-Item "installer\OML-win-Installer.exe" `
            "OML-win-${{ steps.version.outputs.version }}-Installer.exe"

      - name: Build portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path publish\* `
            -DestinationPath "OML-win-${{ steps.version.outputs.version }}-Portable.zip" -Force

      - name: Create release with Chinese notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = "${{ steps.version.outputs.version }}"

          $previous = git describe --tags --abbrev=0 "$tag^" 2>$null
          $range = if ($previous) { "$previous..$tag" } else { $tag }
          $lines = if ($previous) {
            (git log $range --pretty=format:"- %s") -join "`n"
          } else {
            (git log $tag --pretty=format:"- %s" -n 30) -join "`n"
          }

          $notes = @"
          ## OML $version

          $lines

          ### 安装

          - ``OML-win-$version-Installer.exe``：带目录选择页的安装向导（推荐）
          - ``OML-win-$version-Portable.zip``：免安装，解压即用
          - ``OML-$version-full.nupkg`` / ``releases.win.json``：安装版自动更新源

          完整对比：https://github.com/${{ github.repository }}/compare/$($range.Replace('..', '...'))
          "@

          [System.IO.File]::WriteAllText("$PWD\release-notes.md", $notes, [System.Text.UTF8Encoding]::new($false))

          $nupkg = Get-ChildItem Releases -Filter "*.nupkg" | Select-Object -First 1
          if (-not $nupkg) { throw "vpk 没有生成 nupkg，自动更新源无法发布" }

          gh release create $tag `
            --title "OML v$version" `
            --notes-file release-notes.md `
            --latest `
            "OML-win-$version-Installer.exe" `
            "OML-win-$version-Portable.zip" `
            $nupkg.FullName `
            "Releases\releases.win.json" `
            "Releases\assets.win.json"
